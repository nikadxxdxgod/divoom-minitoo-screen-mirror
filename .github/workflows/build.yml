name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Translations complete
        run: python tools/i18n_extract.py --check

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import minitoo; print(minitoo.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: EXE (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean MiniTooMirror.spec

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/MiniTooMirror/LICENSE.txt
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                          "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          Write-Host "Using $iscc"
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer/MiniTooMirror.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/MiniTooMirror/* -DestinationPath "dist/MiniTooMirror-${{ steps.ver.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MiniTooMirror-${{ steps.ver.outputs.version }}
          path: |
            dist/MiniTooMirror-Setup-*.exe
            dist/MiniTooMirror-*-portable.zip

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MiniTooMirror-Setup-*.exe
            dist/MiniTooMirror-*-portable.zip
          generate_release_notes: true
